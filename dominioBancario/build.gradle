plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.4'
	id 'io.spring.dependency-management' version '1.1.6'
}

group = 'me.dio'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = '21'
}


repositories {
	mavenCentral()
}

dependencies {
	//starter básico
	implementation 'org.springframework.boot:spring-boot-starter'
	
	//dpendências para testes
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	
	//persistência de dados
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

	// Starter para Web (inclui Tomcat e Jackson por padrão)
	implementation 'org.springframework.boot:spring-boot-starter-web'
	
	// OpenAPI (Swagger para documentação) https://github.com/springdoc/springdoc-openapi
	//acessar em https://localhost:8080/swagger-ui.html
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.1.0'

	// Banco de dados em memória (usado para testes ou desenvolvimento)
	runtimeOnly 'com.h2database:h2'

	 // Driver do PostgreSQL (usado em produção ou desenvolvimento)
	runtimeOnly 'org.postgresql:postgresql'

	 // (Opcional) Lombok para reduzir boilerplate
    implementation 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
}

//cinfiguração necessária para o Railway (Reference Path)
tasks.jar {
	manifest["Main.Class"] = "me.dio.Application"
}

tasks.named('test') {
	useJUnitPlatform()
}
